      - name: Pin Docker runtime, build pinned CRIU, and verify checkpoint support
        # Gate this step/job with GitHub's condition `steps.enabled.outputs.run == 'true'`; this controls whether evidence is still collected after partial failures.
        if: steps.enabled.outputs.run == 'true'
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
        env:
          # Set `SHARD` from GitHub context/expression `${{ matrix.shard }}`, passing an earlier input/output into this stage without recomputing it.
          SHARD: ${{ matrix.shard }}
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Force locale-stable command output so parsing and evidence text do not vary with runner locale.
          export LC_ALL=C
          # Set `out` to `"evidence/shard-${SHARD}"` for later commands in this step; naming the intermediate makes diagnostics and cleanup deterministic.
          out="evidence/shard-${SHARD}"
          # Create the working directories `"$out"` idempotently before writing manifests/results into them.
          mkdir -p "$out"
          # Mirror this step’s stdout/stderr into an evidence log while still streaming it live to the Actions console.
          exec > >(tee "$out/runtime-setup.log") 2>&1
          # Record the current setup phase as `initialization`; the EXIT trap writes this into runtime-setup.json if setup fails.
          phase=initialization
          # Initialize the CRIU source-commit field before fetch; the EXIT report can then distinguish early failures from verified builds.
          source_commit=''
          # Define an EXIT-trap reporter that always records whether runtime setup passed and the last phase reached.
          finish() {
            # Capture the original exit code immediately so diagnostics do not overwrite the failure status.
            rc=$?
            # Disable the EXIT trap while executing the trap handler itself, preventing recursive invocation.
            trap - EXIT
            # Temporarily allow diagnostic/reporting commands to fail without masking the original experiment failure.
