        uses: actions/download-artifact@v4
        # Pass explicit parameters to the action above; keeping them in YAML makes artifact naming and retention auditable.
        with:
          # Label this job/step as 'stage1-manifest' so failures are attributable without opening raw logs.
          name: stage1-manifest
          # Use `stage1-manifest` as the artifact source/destination path for this transfer.
          path: stage1-manifest

      # Start a visible Actions step named 'Ignore unused matrix slots when shard_count is lower than 20'; this label is what a reviewer sees in the run log.
      - name: Ignore unused matrix slots when shard_count is lower than 20
        # Set `id` to `enabled` for this workflow component; this value is later consumed by the experiment or its reporting logic.
        id: enabled
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Branch on `if [ "${{ matrix.shard }}" -lt "${SHARD_COUNT}" ]; then`; the following block handles this specific runtime/result condition explicitly rather than hiding it.
          if [ "${{ matrix.shard }}" -lt "${SHARD_COUNT}" ]; then
            # Emit this explicit status/error message into the Actions log so the reason for the final gate is obvious to a reviewer.
            echo 'run=true' >> "$GITHUB_OUTPUT"
          # Take the alternate path when the preceding condition is false.
          else
            # Emit this explicit status/error message into the Actions log so the reason for the final gate is obvious to a reviewer.
            echo 'run=false' >> "$GITHUB_OUTPUT"
          # Close the preceding conditional, loop, or shell function; no experiment logic is added on this line.
          fi

