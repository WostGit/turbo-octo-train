        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
        env:
          # Set `SHARD` from GitHub context/expression `${{ matrix.shard }}`, passing an earlier input/output into this stage without recomputing it.
          SHARD: ${{ matrix.shard }}
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Create the working directories `"evidence/shard-${SHARD}"` idempotently before writing manifests/results into them.
          mkdir -p "evidence/shard-${SHARD}"
          # Record Docker client/server details in evidence and verify that the daemon actually restarted on the intended version.
          docker version > "evidence/shard-${SHARD}/docker-version.txt" 2>&1 || true
          # Capture daemon configuration, storage driver, cgroup mode, and experimental-feature status for reproducibility.
          docker info > "evidence/shard-${SHARD}/docker-info.txt" 2>&1 || true
          # Execute `sudo /usr/sbin/criu --version > "evidence/shard-${SHARD}/criu-version.txt" 2>&1 || true` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          sudo /usr/sbin/criu --version > "evidence/shard-${SHARD}/criu-version.txt" 2>&1 || true
          # Capture recent Docker/containerd service logs; these are essential for distinguishing CRIU failures from daemon/content-store failures.
          sudo journalctl -u docker -u containerd --since '6 hours ago' --no-pager > "evidence/shard-${SHARD}/runtime-journal.log" 2>&1 || true
          # Capture kernel messages because checkpoint failures can originate in namespace, security, or kernel-feature constraints invisible to Docker stderr.
          sudo dmesg --ctime > "evidence/shard-${SHARD}/dmesg.log" 2>&1 || true

      # Start a visible Actions step named 'Upload shard results'; this label is what a reviewer sees in the run log.
      - name: Upload shard results
        # Gate this step/job with GitHub's condition `always() && steps.enabled.outputs.run == 'true'`; this controls whether evidence is still collected after partial failures.
        if: always() && steps.enabled.outputs.run == 'true'
        # Use the pinned marketplace action `actions/upload-artifact@v4` for artifact transfer instead of custom upload/download code.
        uses: actions/upload-artifact@v4
        # Pass explicit parameters to the action above; keeping them in YAML makes artifact naming and retention auditable.
        with:
          # Label this job/step as 'stage1-shard-${{ matrix.shard }}' so failures are attributable without opening raw logs.
          name: stage1-shard-${{ matrix.shard }}
          # Start the literal `path` block. The following 2 lines are data consumed by the GitHub action, so comments cannot be inserted between them.
          # literal line 1: Include `results/shard-${{ matrix.shard }}/`: the structured per-image result records that support pass/fail and memory-fidelity claims.
          # literal line 2: Include `evidence/shard-${{ matrix.shard }}/`: raw console/runtime/kernel diagnostics needed to audit why a shard passed or failed.
          path: |
            results/shard-${{ matrix.shard }}/
            evidence/shard-${{ matrix.shard }}/
          # Treat missing artifact files as `error` because absence here signals whether evidence collection itself failed.
          if-no-files-found: error
          # Retain this intermediate artifact for 14 days; final releases are the durable citation surface.
          retention-days: 14

  # Run focused semantic tests for state classes where CRIU is known to have boundaries or where exploit replay needs stronger evidence.
  limitations:
    # Label this job/step as 'Validate CRIU limitation relevance' so failures are attributable without opening raw logs.
    name: Validate CRIU limitation relevance
    # Do not start this job until prepare has produced the manifest/runtime evidence it depends on.
    needs: prepare
    # Run on ubuntu-24.04; pinning Ubuntu avoids silently changing kernel/userspace assumptions between runs.
    runs-on: ubuntu-24.04
    # Cap this job at 60 minutes so a hung pull/checkpoint cannot consume a runner indefinitely.
    timeout-minutes: 60
    # List this job’s operations in execution order; later steps consume files and outputs produced by earlier ones.
    steps:
      # Start a visible Actions step named 'Download immutable sweep manifest'; this label is what a reviewer sees in the run log.
      - name: Download immutable sweep manifest
        # Use the pinned marketplace action `actions/download-artifact@v4` for artifact transfer instead of custom upload/download code.
        uses: actions/download-artifact@v4
        # Pass explicit parameters to the action above; keeping them in YAML makes artifact naming and retention auditable.
        with:
          # Label this job/step as 'stage1-manifest' so failures are attributable without opening raw logs.
          name: stage1-manifest
          # Use `stage1-manifest` as the artifact source/destination path for this transfer.
          path: stage1-manifest

      # Start a visible Actions step named 'Pin Docker runtime and build pinned CRIU'; this label is what a reviewer sees in the run log.
      - name: Pin Docker runtime and build pinned CRIU
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Force locale-stable command output so parsing and evidence text do not vary with runner locale.
          export LC_ALL=C
          # Create the working directories `limitations-evidence` idempotently before writing manifests/results into them.
          mkdir -p limitations-evidence
          # Mirror this step’s stdout/stderr into an evidence log while still streaming it live to the Actions console.
          exec > >(tee limitations-evidence/runtime-setup.log) 2>&1

          # Verify passwordless sudo is available because CRIU installation, kernel diagnostics, and containerd inspection require root privileges on the runner.
          sudo -n true
          # Refresh package metadata with retries so subsequent pinned package installation is reproducible rather than dependent on a stale runner cache.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          # This is one Bash command split with trailing `\`. The per-line explanations stay above the command because an inserted comment inside the continuation would change shell parsing.
          # physical line 1: Install only the build/runtime dependencies required for CRIU and Docker checkpointing; the explicit list is part of the reproducible environment.
          # physical line 2: Execute `ca-certificates curl gnupg git build-essential libc6-dev file pkg-config python3 python3-protobuf \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 3: Execute `libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 4: Execute `libnl-3-dev libnet1-dev libcap-dev libbsd-dev uuid-dev libgnutls28-dev \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 5: Execute `libnftables-dev libaio-dev liblz4-dev iproute2 iptables util-linux` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg git build-essential libc6-dev file pkg-config python3 python3-protobuf \
            libprotobuf-dev libprotobuf-c-dev protobuf-c-compiler protobuf-compiler \
            libnl-3-dev libnet1-dev libcap-dev libbsd-dev uuid-dev libgnutls28-dev \
            libnftables-dev libaio-dev liblz4-dev iproute2 iptables util-linux

          # Create an isolated temporary CRIU source directory under RUNNER_TEMP so concurrent jobs cannot collide.
          src="$(mktemp -d "$RUNNER_TEMP/criu-source.XXXXXX")"
          # Initialize a minimal Git repository for fetching exactly the pinned CRIU commit instead of cloning unrelated history.
          git init -q "$src"
          # Point that temporary repository at upstream CRIU; the next command fetches only the selected commit.
          git -C "$src" remote add origin https://github.com/checkpoint-restore/criu.git
          # Fetch exactly one CRIU commit with depth 1, minimizing network and proving which source was compiled.
          git -C "$src" fetch --depth=1 origin "$CRIU_COMMIT"
          # Checkout the fetched commit in detached mode so the build cannot drift with a branch name.
          git -C "$src" checkout --detach FETCH_HEAD
          # Assert the runtime invariant `[ "$(git -C "$src" rev-parse HEAD)" = "$CRIU_COMMIT" ]`; if it is false, strict Bash stops the experiment before results can be trusted.
          [ "$(git -C "$src" rev-parse HEAD)" = "$CRIU_COMMIT" ]
          # This is one Bash command split with trailing `\`. The per-line explanations stay above the command because an inserted comment inside the continuation would change shell parsing.
          # physical line 1: Compile the CRIU executable from the pinned source; verbose build output is retained as evidence of the toolchain step.
          # physical line 2: Execute `2>&1 | tee limitations-evidence/criu-build.log` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          make -C "$src" -j2 V=1 WERROR=0 PYTHON=/usr/bin/python3 criu \
            2>&1 | tee limitations-evidence/criu-build.log
          # Require the expected CRIU binary to exist and be executable before installing anything system-wide.
          test -x "$src/criu/criu"
          # Install exactly the binary just built as `/usr/sbin/criu`, avoiding distro-package version drift.
          sudo install -m 0755 "$src/criu/criu" /usr/sbin/criu
          # Install the optional namespace helper only when this CRIU source revision produced it.
          if [ -x "$src/scripts/criu-ns" ]; then
            # Install CRIU’s namespace helper when available; it is needed for some namespace restore paths but is not assumed to exist in every source revision.
            sudo install -m 0755 "$src/scripts/criu-ns" /usr/sbin/criu-ns
          # Close the preceding conditional, loop, or shell function; no experiment logic is added on this line.
          fi
          # Save the limitations job’s CRIU version independently, so its semantic tests can be tied to the same implementation as the corpus sweep.
          sudo /usr/sbin/criu --version | tee limitations-evidence/criu-version.txt
          # Refuse to run limitation tests if the built binary does not identify as the expected CRIU release.
          sudo /usr/sbin/criu --version | grep -F "Version: $CRIU_VERSION"
          # Delete build sources after installation to recover runner disk before pulling multi-gigabyte target images.
          rm -rf "$src"

          # Execute `sudo install -m 0755 -d /etc/apt/keyrings` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          sudo install -m 0755 -d /etc/apt/keyrings
          # This is one Bash command split with trailing `\`. The per-line explanations stay above the command because an inserted comment inside the continuation would change shell parsing.
          # physical line 1: Fetch Docker’s repository signing key over HTTPS; package versions are pinned later, so this only establishes the trusted package source.
          # physical line 2: Execute `| sudo tee /etc/apt/keyrings/docker.asc >/dev/null` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
            | sudo tee /etc/apt/keyrings/docker.asc >/dev/null
          # Execute `sudo chmod a+r /etc/apt/keyrings/docker.asc` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          # This is one Bash command split with trailing `\`. The per-line explanations stay above the command because an inserted comment inside the continuation would change shell parsing.
          # physical line 1: Write a machine- or human-readable status record without shell-dependent echo escaping.
          # physical line 2: Execute `'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 3: Execute `| sudo tee /etc/apt/sources.list.d/docker-stage1.list >/dev/null` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          printf '%s\n' \
            'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable' \
            | sudo tee /etc/apt/sources.list.d/docker-stage1.list >/dev/null
          # Refresh package metadata with retries so subsequent pinned package installation is reproducible rather than dependent on a stale runner cache.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 update
          # Execute `apt-cache madison docker-ce | awk '{print $3}' | grep -Fx -- "$DOCKER_ENGINE_VERSION"` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          apt-cache madison docker-ce | awk '{print $3}' | grep -Fx -- "$DOCKER_ENGINE_VERSION"
          # Execute `apt-cache madison containerd.io | awk '{print $3}' | grep -Fx -- "$CONTAINERD_VERSION"` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          apt-cache madison containerd.io | awk '{print $3}' | grep -Fx -- "$CONTAINERD_VERSION"
          # Stop Docker/containerd before downgrading pinned runtime packages, avoiding a half-upgraded live daemon.
          sudo systemctl stop docker.service docker.socket containerd.service 2>/dev/null || true
          # Remove runner-image package holds temporarily so the experiment can install its tested Docker/containerd versions.
          sudo apt-mark unhold docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io >/dev/null 2>&1 || true
          # This is one Bash command split with trailing `\`. The per-line explanations stay above the command because an inserted comment inside the continuation would change shell parsing.
          # physical line 1: Install only the build/runtime dependencies required for CRIU and Docker checkpointing; the explicit list is part of the reproducible environment.
          # physical line 2: Execute `"docker-ce=$DOCKER_ENGINE_VERSION" \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 3: Execute `"docker-ce-cli=$DOCKER_ENGINE_VERSION" \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 4: Execute `"docker-ce-rootless-extras=$DOCKER_ENGINE_VERSION" \` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          # physical line 5: Execute `"containerd.io=$CONTAINERD_VERSION"` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --allow-downgrades --no-install-recommends \
            "docker-ce=$DOCKER_ENGINE_VERSION" \
            "docker-ce-cli=$DOCKER_ENGINE_VERSION" \
            "docker-ce-rootless-extras=$DOCKER_ENGINE_VERSION" \
            "containerd.io=$CONTAINERD_VERSION"
          # Re-hold the pinned runtime after installation so later apt operations cannot silently upgrade it mid-run.
          sudo apt-mark hold docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io >/dev/null

          # Ensure Docker’s configuration directory exists before installing the experiment-specific daemon configuration.
          sudo mkdir -p /etc/docker
          # Run the embedded Python block below for structured parsing/validation/report generation that would be brittle in shell alone.
          python3 - <<'PYDOCKER'
          # Import the modules needed here: `import json,pathlib`; these provide parsing, hashing, subprocess, timing, or filesystem primitives without external Python packages.
          import json,pathlib
          # Compute `p` from `pathlib.Path('/etc/docker/daemon.json')`; this value becomes an input to the next validation/reporting step.
          p=pathlib.Path('/etc/docker/daemon.json')
          # Start a guarded operation whose failure is converted into explicit evidence/classification below instead of crashing without context.
          try:
              # Compute `obj` from `json.loads(p.read_text()) if p.exists() else {}`; this value becomes an input to the next validation/reporting step.
              obj=json.loads(p.read_text()) if p.exists() else {}
              # Test `not isinstance(obj,dict): obj={}` before accepting this state; the nested block handles the exceptional or qualifying case.
              if not isinstance(obj,dict): obj={}
          # Handle `except Exception:` and preserve the failure as structured evidence where possible.
          except Exception:
              # Compute `obj` from `{}`; this value becomes an input to the next validation/reporting step.
              obj={}
          # Compute `obj['experimental']` from `True`; this value becomes an input to the next validation/reporting step.
          obj['experimental']=True
          # Compute `features` from `obj.get('features') if isinstance(obj.get('features'),dict) else {}`; this value becomes an input to the next validation/reporting step.
          features=obj.get('features') if isinstance(obj.get('features'),dict) else {}
          # Compute `features['containerd-snapshotter']` from `False`; this value becomes an input to the next validation/reporting step.
          features['containerd-snapshotter']=False
          # Compute `obj['features']` from `features`; this value becomes an input to the next validation/reporting step.
          obj['features']=features
          # Persist structured evidence with `pathlib.Path('/tmp/stage1-daemon.json').write_text(json.dumps(obj,indent=2)+'\n')` so the aggregate job can reproduce the conclusion without scraping console logs.
          pathlib.Path('/tmp/stage1-daemon.json').write_text(json.dumps(obj,indent=2)+'\n')
          # End the embedded Python helper; Bash resumes with the structured output/files it produced.
          PYDOCKER
          # Ask dockerd to parse the generated configuration before replacing the live daemon config; a typo should fail here, not during the experiment.
          sudo dockerd --validate --config-file /tmp/stage1-daemon.json
          # Install the validated daemon configuration that enables experimental checkpoint support and disables the containerd snapshotter path used by newer Docker defaults.
          sudo install -m 0644 /tmp/stage1-daemon.json /etc/docker/daemon.json
          # Reload systemd metadata after package/runtime changes before restarting container services.
          sudo systemctl daemon-reload
          # Restart containerd first so Docker reconnects to the intended pinned content-store daemon.
          sudo systemctl restart containerd
          # Restart Docker after containerd and daemon.json are fixed, making the next version checks authoritative.
          sudo systemctl restart docker
          # Assert the runtime invariant `[ "$(docker version --format '{{.Server.Version}}')" = '27.5.1' ]`; if it is false, strict Bash stops the experiment before results can be trusted.
          [ "$(docker version --format '{{.Server.Version}}')" = '27.5.1' ]
          # Record and verify the containerd version because restore behavior depends on its content-store implementation.
          containerd --version | grep -F ' 1.7.25 ' >/dev/null
          # Assert the runtime invariant `[ "$(docker info --format '{{.ExperimentalBuild}}' | tr '[:upper:]' '[:lower:]')" = true ]`; if it is false, strict Bash stops the experiment before results can be trusted.
          [ "$(docker info --format '{{.ExperimentalBuild}}' | tr '[:upper:]' '[:lower:]')" = true ]
          # Record Docker client/server details in evidence and verify that the daemon actually restarted on the intended version.
          docker version > limitations-evidence/docker-version.txt
          # Capture daemon configuration, storage driver, cgroup mode, and experimental-feature status for reproducibility.
          docker info > limitations-evidence/docker-info.txt
          # `criu check` is collected as diagnostic context only; concrete Docker checkpoint/restore tests remain authoritative because optional kernel features can make this check noisy.
          sudo /usr/sbin/criu check -v4 > limitations-evidence/criu-check.txt 2>&1 || true

      # Start a visible Actions step named 'Run semantic fidelity and limitation probes'; this label is what a reviewer sees in the run log.
      - name: Run semantic fidelity and limitation probes
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Create the working directories `limitations-evidence limitations-result` idempotently before writing manifests/results into them.
          mkdir -p limitations-evidence limitations-result

          # Write the embedded source/program below to a temporary file; this keeps the workflow self-contained and versioned with the experiment.
          cat > "$RUNNER_TEMP/semantic-probe.c" <<'SEMANTIC_C'
          // Enable GNU extensions before any headers so register/ucontext and Linux-specific interfaces used by the fidelity probe are visible at compile time.
          #define _GNU_SOURCE
          // Include `<errno.h>` specifically for distinguishing expected syscall failure modes from test bugs; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <errno.h>
          // Include `<fcntl.h>` specifically for file-descriptor creation/flags; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <fcntl.h>
          // Include `<pthread.h>` specifically for threads, thread stacks, and TLS; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <pthread.h>
          // Include `<signal.h>` specifically for asking the original checkpointed process/threads to expose state; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <signal.h>
          // Include `<stdint.h>` specifically for fixed-width magic values that survive architecture/compiler ambiguity; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <stdint.h>
          // Include `<stdio.h>` specifically for structured evidence output; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <stdio.h>
          // Include `<stdlib.h>` specifically for allocation and process utility functions; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <stdlib.h>
          // Include `<string.h>` specifically for deterministic state initialization/comparison; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <string.h>
          // Include `<sys/mman.h>` specifically for anonymous/file/shared mappings plus executable JIT-like pages; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/mman.h>
          // Include `<sys/socket.h>` specifically for Unix socket state; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/socket.h>
          // Include `<sys/stat.h>` specifically for filesystem metadata used by the writable-layer test; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/stat.h>
          // Include `<sys/types.h>` specifically for portable POSIX process/file types; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/types.h>
          // Include `<sys/ucontext.h>` specifically for register capture from the interrupted thread context; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/ucontext.h>
          // Include `<sys/wait.h>` specifically for child-process lifecycle checks; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <sys/wait.h>
          // Include `<time.h>` specifically for stable delays/timing inside the long-lived probe; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <time.h>
          // Include `<unistd.h>` specifically for fork, pipe, read/write, lseek, and process primitives; the probe is statically linked so these APIs are compiled into the witness binary.
          #include <unistd.h>

          // Declare `static volatile sig_atomic_t stopflag=0, snapshotflag=0, verifyflag=0;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile sig_atomic_t stopflag=0, snapshotflag=0, verifyflag=0;
          // Declare `static volatile uint64_t counter=0;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile uint64_t counter=0;
          // Initialize/update `static uint64_t nonce` with a deterministic value used by the semantic probe before or after checkpoint.
          static uint64_t nonce=UINT64_C(0x4d69746967617465);
          // Initialize/update `static int state_fd` with a deterministic value used by the semantic probe before or after checkpoint.
          static int state_fd=-1, mmap_fd=-1, pipefd_[2]={-1,-1}, unixfd[2]={-1,-1};
          // Initialize/update `static pid_t child` with a deterministic value used by the semantic probe before or after checkpoint.
          static pid_t child=-1;
          // Declare `static volatile uint64_t *shared_counter=NULL;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile uint64_t *shared_counter=NULL;
          // Initialize/update `static unsigned char *heap_state` with a deterministic value used by the semantic probe before or after checkpoint.
          static unsigned char *heap_state=NULL, *anon_map=NULL, *file_map=NULL, *jit_page=NULL;
          // Initialize/update `static size_t heap_n` with a deterministic value used by the semantic probe before or after checkpoint.
          static size_t heap_n=(4u<<20), anon_n=(2u<<20), file_n=(1u<<20);
          // Execute `static pthread_t state_thread, register_thread_id;` as one concrete probe operation; it contributes to the state later validated across checkpoint/restore.
          static pthread_t state_thread, register_thread_id;
          // Declare `static volatile unsigned char *thread_stack_ptr=NULL;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile unsigned char *thread_stack_ptr=NULL;
          // Declare `static volatile uint64_t *thread_tls_ptr=NULL;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile uint64_t *thread_tls_ptr=NULL;
          // Initialize/update `static _Thread_local uint64_t thread_tls_magic` with a deterministic value used by the semantic probe before or after checkpoint.
          static _Thread_local uint64_t thread_tls_magic=0;
          // Declare `static volatile sig_atomic_t reg_capture_ready=0;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile sig_atomic_t reg_capture_ready=0;
          // Declare `static volatile uint64_t cap_r12=0,cap_r13=0,cap_r14=0,cap_r15=0;` volatile because a signal handler or another thread changes it asynchronously and the compiler must not optimize those reads away.
          static volatile uint64_t cap_r12=0,cap_r13=0,cap_r14=0,cap_r15=0;
          // Initialize/update `static const uint64_t R12_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t R12_MAGIC=UINT64_C(0x12121212a1a1a1a1);
          // Initialize/update `static const uint64_t R13_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t R13_MAGIC=UINT64_C(0x13131313b2b2b2b2);
          // Initialize/update `static const uint64_t R14_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t R14_MAGIC=UINT64_C(0x14141414c3c3c3c3);
          // Initialize/update `static const uint64_t R15_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t R15_MAGIC=UINT64_C(0x15151515d4d4d4d4);
          // Initialize/update `static const uint64_t TLS_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t TLS_MAGIC=UINT64_C(0x746c732d6d616769);
          // Initialize/update `static const uint64_t JIT_MAGIC` with a deterministic value used by the semantic probe before or after checkpoint.
          static const uint64_t JIT_MAGIC=UINT64_C(0x4a49542d53544154);
          // Initialize/update `static const char *file_payload` with a deterministic value used by the semantic probe before or after checkpoint.
