              # Emit `print('  limitations=' + json.dumps(limitations.get('status_counts') or {}, sort_keys=True))` into the Actions log; these lines are intentionally human-auditable checkpoints alongside JSON evidence.
              print('  limitations=' + json.dumps(limitations.get('status_counts') or {}, sort_keys=True))

          # Use the context manager `zipfile.ZipFile('stage1-final/stage1-complete-evidence.zip','w',zipfile.ZIP_DEFLATED) as z` so the file/network resource is closed even if parsing fails.
          with zipfile.ZipFile('stage1-final/stage1-complete-evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
              # Iterate through `base in (pathlib.Path('downloaded/manifest'), pathlib.Path('downloaded/shards'), pathlib.Path('downloaded/limitations'))` so each task/image/file contributes deterministically to the manifest or report.
              for base in (pathlib.Path('downloaded/manifest'), pathlib.Path('downloaded/shards'), pathlib.Path('downloaded/limitations')):
                  # Test `base.exists()` before accepting this state; the nested block handles the exceptional or qualifying case.
                  if base.exists():
                      # Iterate through `p in base.rglob('*')` so each task/image/file contributes deterministically to the manifest or report.
                      for p in base.rglob('*'):
                          # Test `p.is_file(): z.write(p, p.as_posix())` before accepting this state; the nested block handles the exceptional or qualifying case.
                          if p.is_file(): z.write(p, p.as_posix())
              # Iterate through `p in pathlib.Path('stage1-final').glob('*')` so each task/image/file contributes deterministically to the manifest or report.
              for p in pathlib.Path('stage1-final').glob('*'):
                  # Test `p.is_file() and p.name != 'stage1-complete-evidence.zip': z.write(p,p.as_posix())` before accepting this state; the nested block handles the exceptional or qualifying case.
                  if p.is_file() and p.name != 'stage1-complete-evidence.zip': z.write(p,p.as_posix())

          # Use the context manager `open(os.environ['GITHUB_OUTPUT'],'a') as f` so the file/network resource is closed even if parsing fails.
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              # Execute `f.write(f'passed={len(passed)}\nfailed={len(failed)}\n')` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              f.write(f'passed={len(passed)}\nfailed={len(failed)}\n')
          # Test `os.environ.get('GITHUB_STEP_SUMMARY')` before accepting this state; the nested block handles the exceptional or qualifying case.
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              # Use the context manager `open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f` so the file/network resource is closed even if parsing fails.
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  # Execute `f.write(pathlib.Path('stage1-final/summary.md').read_text())` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
                  f.write(pathlib.Path('stage1-final/summary.md').read_text())
          # End the embedded Python helper; Bash resumes with the structured output/files it produced.
          PY

      # Start a visible Actions step named 'Upload aggregate result'; this label is what a reviewer sees in the run log.
      - name: Upload aggregate result
        # Use the pinned marketplace action `actions/upload-artifact@v4` for artifact transfer instead of custom upload/download code.
        uses: actions/upload-artifact@v4
        # Pass explicit parameters to the action above; keeping them in YAML makes artifact naming and retention auditable.
        with:
          # Label this job/step as 'exploitgym-criu-stage1-${{ github.run_id }}-${{ github.run_attempt }}' so failures are attributable without opening raw logs.
          name: exploitgym-criu-stage1-${{ github.run_id }}-${{ github.run_attempt }}
          # Use `stage1-final/` as the artifact source/destination path for this transfer.
          path: stage1-final/
          # Treat missing artifact files as `error` because absence here signals whether evidence collection itself failed.
          if-no-files-found: error
          # Retain this intermediate artifact for 30 days; final releases are the durable citation surface.
          retention-days: 30

      # Start a visible Actions step named 'Publish immutable GitHub Release'; this label is what a reviewer sees in the run log.
      - name: Publish immutable GitHub Release
        # Gate this step/job with GitHub's condition `${{ inputs.publish_release }}`; this controls whether evidence is still collected after partial failures.
        if: ${{ inputs.publish_release }}
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
        env:
          # Set `GH_TOKEN` from GitHub context/expression `${{ github.token }}`, passing an earlier input/output into this stage without recomputing it.
          GH_TOKEN: ${{ github.token }}
          # Set `TAG` from GitHub context/expression `criu-stage1-${{ github.run_id }}-${{ github.run_attempt }}`, passing an earlier input/output into this stage without recomputing it.
          TAG: criu-stage1-${{ github.run_id }}-${{ github.run_attempt }}
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Run the embedded Python block below for structured parsing/validation/report generation that would be brittle in shell alone.
          python3 - <<'PYRELEASE'
          # Import the modules needed here: `import json, mimetypes, os, pathlib, urllib.parse, urllib.request`; these provide parsing, hashing, subprocess, timing, or filesystem primitives without external Python packages.
          import json, mimetypes, os, pathlib, urllib.parse, urllib.request

          # Compute `token` from `os.environ['GH_TOKEN']`; this value becomes an input to the next validation/reporting step.
          token=os.environ['GH_TOKEN']
          # Compute `repo` from `os.environ['GITHUB_REPOSITORY']`; this value becomes an input to the next validation/reporting step.
          repo=os.environ['GITHUB_REPOSITORY']
          # Compute `tag` from `os.environ['TAG']`; this value becomes an input to the next validation/reporting step.
          tag=os.environ['TAG']
          # Compute `target` from `os.environ['GITHUB_SHA']`; this value becomes an input to the next validation/reporting step.
          target=os.environ['GITHUB_SHA']
          # Compute `summary` from `pathlib.Path('stage1-final/summary.md').read_text()`; this value becomes an input to the next validation/reporting step.
          summary=pathlib.Path('stage1-final/summary.md').read_text()
          # Compute `api` from `'https://api.github.com/repos/'+repo`; this value becomes an input to the next validation/reporting step.
          api='https://api.github.com/repos/'+repo
          # Compute `headers` from `{`; this value becomes an input to the next validation/reporting step.
          headers={
              # Execute `'Authorization':'Bearer '+token,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'Authorization':'Bearer '+token,
              # Execute `'Accept':'application/vnd.github+json',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'Accept':'application/vnd.github+json',
              # Execute `'X-GitHub-Api-Version':'2022-11-28',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'X-GitHub-Api-Version':'2022-11-28',
              # Execute `'User-Agent':'exploitgym-criu-stage1',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'User-Agent':'exploitgym-criu-stage1',
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          }

          # Define `call()` so this operation is implemented once and reused consistently across every image/result.
          def call(url, *, data=None, method=None, content_type='application/json'):
              # Compute `h` from `dict(headers)`; this value becomes an input to the next validation/reporting step.
              h=dict(headers)
              # Test `data is not None: h['Content-Type']=content_type` before accepting this state; the nested block handles the exceptional or qualifying case.
              if data is not None: h['Content-Type']=content_type
              # Compute `req` from `urllib.request.Request(url, data=data, headers=h, method=method)`; this value becomes an input to the next validation/reporting step.
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              # Use the context manager `urllib.request.urlopen(req, timeout=120) as r` so the file/network resource is closed even if parsing fails.
              with urllib.request.urlopen(req, timeout=120) as r:
                  # Return `r.read(), r.status` to the caller; downstream validation uses this normalized value rather than reparsing raw command output.
                  return r.read(), r.status

          # Compute `payload` from `json.dumps({`; this value becomes an input to the next validation/reporting step.
          payload=json.dumps({
              # Execute `'tag_name':tag, 'target_commitish':target,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'tag_name':tag, 'target_commitish':target,
              # Execute `'name':f'ExploitGym CRIU Stage 1 — {tag}',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'name':f'ExploitGym CRIU Stage 1 — {tag}',
              # Execute `'body':summary, 'draft':False, 'prerelease':False,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'body':summary, 'draft':False, 'prerelease':False,
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          }).encode()
          # Execute `raw,status=call(api+'/releases',data=payload,method='POST')` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
          raw,status=call(api+'/releases',data=payload,method='POST')
          # Compute `release` from `json.loads(raw)`; this value becomes an input to the next validation/reporting step.
          release=json.loads(raw)
          # Compute `upload_url` from `release['upload_url'].split('{',1)[0]`; this value becomes an input to the next validation/reporting step.
          upload_url=release['upload_url'].split('{',1)[0]
          # Compute `assets` from `[`; this value becomes an input to the next validation/reporting step.
          assets=[
              # Execute `pathlib.Path('stage1-final/summary.json'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/summary.json'),
              # Execute `pathlib.Path('stage1-final/results.csv'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/results.csv'),
              # Execute `pathlib.Path('stage1-final/summary.md'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/summary.md'),
              # Execute `pathlib.Path('stage1-final/limitations-report.json'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/limitations-report.json'),
              # Execute `pathlib.Path('stage1-final/limitations-report.md'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/limitations-report.md'),
              # Execute `pathlib.Path('stage1-final/stage1-complete-evidence.zip'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              pathlib.Path('stage1-final/stage1-complete-evidence.zip'),
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          ]
          # Compute `assets` from `[p for p in assets if p.exists()]`; this value becomes an input to the next validation/reporting step.
          assets=[p for p in assets if p.exists()]
          # Compute `uploaded` from `[]`; this value becomes an input to the next validation/reporting step.
          uploaded=[]
          # Iterate through `path in assets` so each task/image/file contributes deterministically to the manifest or report.
          for path in assets:
              # Compute `data` from `path.read_bytes()`; this value becomes an input to the next validation/reporting step.
              data=path.read_bytes()
              # Compute `url` from `upload_url+'?'+urllib.parse.urlencode({'name':path.name})`; this value becomes an input to the next validation/reporting step.
              url=upload_url+'?'+urllib.parse.urlencode({'name':path.name})
              # Compute `typ` from `mimetypes.guess_type(path.name)[0] or 'application/octet-stream'`; this value becomes an input to the next validation/reporting step.
              typ=mimetypes.guess_type(path.name)[0] or 'application/octet-stream'
              # Execute `body,st=call(url,data=data,method='POST',content_type=typ)` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              body,st=call(url,data=data,method='POST',content_type=typ)
              # Compute `obj` from `json.loads(body)`; this value becomes an input to the next validation/reporting step.
              obj=json.loads(body)
              # Execute `uploaded.append({'name':path.name,'bytes':len(data),'id':obj.get('id')})` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              uploaded.append({'name':path.name,'bytes':len(data),'id':obj.get('id')})
              # Emit `print('RELEASE ASSET',path.name,len(data),'bytes',flush=True)` into the Actions log; these lines are intentionally human-auditable checkpoints alongside JSON evidence.
              print('RELEASE ASSET',path.name,len(data),'bytes',flush=True)
          # Persist structured evidence with `pathlib.Path('stage1-final/release.json').write_text(json.dumps({` so the aggregate job can reproduce the conclusion without scraping console logs.
          pathlib.Path('stage1-final/release.json').write_text(json.dumps({
              # Execute `'tag':tag,'release_id':release.get('id'),'html_url':release.get('html_url'),` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'tag':tag,'release_id':release.get('id'),'html_url':release.get('html_url'),
              # Execute `'assets':uploaded,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'assets':uploaded,
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          },indent=2)+'\n')
          # Emit `print('RELEASE',release.get('html_url'),flush=True)` into the Actions log; these lines are intentionally human-auditable checkpoints alongside JSON evidence.
          print('RELEASE',release.get('html_url'),flush=True)
          # End the embedded Python helper; Bash resumes with the structured output/files it produced.
          PYRELEASE

      # Start a visible Actions step named 'Optional strict compatibility gate'; this label is what a reviewer sees in the run log.
      - name: Optional strict compatibility gate
        # Gate this step/job with GitHub's condition `${{ inputs.fail_on_incompatibility && steps.aggregate.outputs.failed != '0' }}`; this controls whether evidence is still collected after partial failures.
        if: ${{ inputs.fail_on_incompatibility && steps.aggregate.outputs.failed != '0' }}
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Emit this explicit status/error message into the Actions log so the reason for the final gate is obvious to a reviewer.
          echo "${{ steps.aggregate.outputs.failed }} image(s) failed Stage 1 compatibility." >&2
          # Execute `exit 1` as part of this step; it implements the surrounding checkpoint/restore setup, validation, or evidence collection.
          exit 1
