# Give the workflow a recognizable name in the Actions UI; this is the corpus-wide CRIU compatibility and limitations run.
name: ExploitGym CRIU Stage 1 - all target images

# Define how this workflow is started. It is intentionally manual so a publication run is deliberate and reproducible.
on:
  # Expose a Run workflow button and API trigger, with the parameters below recorded by GitHub for each run.
  workflow_dispatch:
    # Collect the few experiment knobs that are allowed to vary without editing the workflow itself.
    inputs:
      # Open the `exploitgym_ref` configuration block; the indented lines below define its behavior or data.
      exploitgym_ref:
        # Explain this manual input in the Actions UI: ExploitGym git ref used to resolve the v1 task list and image metadata.
        description: ExploitGym git ref used to resolve the v1 task list and image metadata
        # Tell workflow_dispatch to validate this input as `string` rather than accepting an arbitrary UI value.
        type: string
        # Use `main` when the operator does not override this input, keeping the standard publication run reproducible.
        default: main
      # Open the `expected_task_count` configuration block; the indented lines below define its behavior or data.
      expected_task_count:
        # Explain this manual input in the Actions UI: Expected ExploitGym v1 task count; guards against silent corpus drift.
        description: Expected ExploitGym v1 task count; guards against silent corpus drift
        # Tell workflow_dispatch to validate this input as `string` rather than accepting an arbitrary UI value.
        type: string
        # Use `'869'` when the operator does not override this input, keeping the standard publication run reproducible.
        default: '869'
      # Open the `user_mode` configuration block; the indented lines below define its behavior or data.
      user_mode:
        # Explain this manual input in the Actions UI: Userspace image mode from metadata.json.
        description: Userspace image mode from metadata.json
        # Tell workflow_dispatch to validate this input as `choice` rather than accepting an arbitrary UI value.
        type: choice
        # Restrict this choice to the supported variants below so an invalid mode cannot enter the experiment unnoticed.
        options:
          # Offer `exp.none` as one userspace hardening/image variant resolved from ExploitGym metadata.
          - exp.none
          # Offer `exp.canary` as one userspace hardening/image variant resolved from ExploitGym metadata.
          - exp.canary
          # Offer `exp.pie` as one userspace hardening/image variant resolved from ExploitGym metadata.
          - exp.pie
          # Offer `exp.relro` as one userspace hardening/image variant resolved from ExploitGym metadata.
          - exp.relro
          # Offer `exp.hardened` as one userspace hardening/image variant resolved from ExploitGym metadata.
          - exp.hardened
        # Use `exp.none` when the operator does not override this input, keeping the standard publication run reproducible.
        default: exp.none
      # Open the `v8_variant` configuration block; the indented lines below define its behavior or data.
      v8_variant:
        # Explain this manual input in the Actions UI: V8 image variant; nosandbox falls back to main if unavailable.
        description: V8 image variant; nosandbox falls back to main if unavailable
        # Tell workflow_dispatch to validate this input as `choice` rather than accepting an arbitrary UI value.
        type: choice
        # Restrict this choice to the supported variants below so an invalid mode cannot enter the experiment unnoticed.
        options:
          # Offer the V8 image variant `main`; `nosandbox` is useful for exploitability experiments when metadata provides it.
          - main
          # Offer the V8 image variant `nosandbox`; `nosandbox` is useful for exploitability experiments when metadata provides it.
          - nosandbox
        # Use `main` when the operator does not override this input, keeping the standard publication run reproducible.
        default: main
      # Open the `shard_count` configuration block; the indented lines below define its behavior or data.
      shard_count:
        # Explain this manual input in the Actions UI: Parallel shard count. Keep at 20 for GitHub Free concurrency..
        description: Parallel shard count. Keep at 20 for GitHub Free concurrency.
        # Tell workflow_dispatch to validate this input as `string` rather than accepting an arbitrary UI value.
        type: string
        # Use `'20'` when the operator does not override this input, keeping the standard publication run reproducible.
        default: '20'
      # Open the `per_image_timeout_seconds` configuration block; the indented lines below define its behavior or data.
      per_image_timeout_seconds:
        # Explain this manual input in the Actions UI: Hard timeout for pull/checkpoint/restore subprocesses per image.
        description: Hard timeout for pull/checkpoint/restore subprocesses per image
        # Tell workflow_dispatch to validate this input as `string` rather than accepting an arbitrary UI value.
        type: string
        # Use `'420'` when the operator does not override this input, keeping the standard publication run reproducible.
        default: '420'
      # Open the `network_policy` configuration block; the indented lines below define its behavior or data.
      network_policy:
        # Explain this manual input in the Actions UI: Network mode for the minimal probe. auto uses the retained loopback-only namespace fixture on the pinned Docker 27 runtime..
        description: Network mode for the minimal probe. auto uses the retained loopback-only namespace fixture on the pinned Docker 27 runtime.
        # Tell workflow_dispatch to validate this input as `choice` rather than accepting an arbitrary UI value.
        type: choice
        # Restrict this choice to the supported variants below so an invalid mode cannot enter the experiment unnoticed.
        options:
          # Add `auto` to this ordered list; ordering is preserved where the downstream tool cares about it.
          - auto
          # Add `host` to this ordered list; ordering is preserved where the downstream tool cares about it.
          - host
          # Add `isolated` to this ordered list; ordering is preserved where the downstream tool cares about it.
          - isolated
        # Use `auto` when the operator does not override this input, keeping the standard publication run reproducible.
        default: auto
      # Open the `publish_release` configuration block; the indented lines below define its behavior or data.
      publish_release:
        # Explain this manual input in the Actions UI: Archive the complete sweep as a GitHub Release.
        description: Archive the complete sweep as a GitHub Release
        # Tell workflow_dispatch to validate this input as `boolean` rather than accepting an arbitrary UI value.
        type: boolean
        # Use `true` when the operator does not override this input, keeping the standard publication run reproducible.
        default: true
      # Open the `fail_on_incompatibility` configuration block; the indented lines below define its behavior or data.
      fail_on_incompatibility:
        # Explain this manual input in the Actions UI: Fail the final job if any image does not pass the smoke test.
        description: Fail the final job if any image does not pass the smoke test
        # Tell workflow_dispatch to validate this input as `boolean` rather than accepting an arbitrary UI value.
        type: boolean
        # Use `false` when the operator does not override this input, keeping the standard publication run reproducible.
        default: false

# Declare the minimum repository permissions the workflow needs.
permissions:
  # Allow the aggregate job to create a GitHub Release and upload the citable evidence bundle; read-only would be insufficient.
  contents: write

# Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
env:
  # Stamp every result with this experiment revision so evidence from incompatible workflow versions cannot be mixed silently.
  SWEEP_REVISION: stage1-image-smoke-9-limitations-report
  # Pin Docker 27.5.1. The experiment avoids known checkpoint/restore regressions seen with newer Docker/network-namespace combinations.
  DOCKER_ENGINE_VERSION: '5:27.5.1-1~ubuntu.24.04~noble'
  # Pin containerd 1.7.25 to keep checkpoint content-store behavior stable across hosted runner image updates.
  CONTAINERD_VERSION: '1.7.25-1'
  # Record the human-readable CRIU release expected from the pinned source build.
  CRIU_VERSION: '4.3'
  # Pin CRIU by commit, not merely by version label, so the exact source used for the paper can be reconstructed.
  CRIU_COMMIT: 2b7ac603cda31d015d91c856c34c557cb2300e7d
  # Set `SHARD_COUNT` from GitHub context/expression `${{ inputs.shard_count || '20' }}`, passing an earlier input/output into this stage without recomputing it.
  SHARD_COUNT: ${{ inputs.shard_count || '20' }}
  # Set `PER_IMAGE_TIMEOUT` from GitHub context/expression `${{ inputs.per_image_timeout_seconds || '420' }}`, passing an earlier input/output into this stage without recomputing it.
  PER_IMAGE_TIMEOUT: ${{ inputs.per_image_timeout_seconds || '420' }}
  # Set `NETWORK_POLICY` from GitHub context/expression `${{ inputs.network_policy || 'auto' }}`, passing an earlier input/output into this stage without recomputing it.
  NETWORK_POLICY: ${{ inputs.network_policy || 'auto' }}
  # Bound retries for a narrow Docker/containerd transport race; genuine CRIU restore failures are not retried away.
  RESTORE_MAX_ATTEMPTS: '5'
  # Wait briefly after checkpoint creation before restore because immediate restore can hit a transient content-store race.
  RESTORE_SETTLE_SECONDS: '1'

# Start the job graph: resolve the corpus, sweep it in parallel, probe known limitations, then aggregate evidence.
jobs:
  # Resolve the exact ExploitGym corpus first. Every later result is tied back to this immutable manifest.
  prepare:
    # Label this job/step as 'Resolve and deduplicate target images' so failures are attributable without opening raw logs.
    name: Resolve and deduplicate target images
    # Run on ubuntu-24.04; pinning Ubuntu avoids silently changing kernel/userspace assumptions between runs.
    runs-on: ubuntu-24.04
    # Cap this job at 15 minutes so a hung pull/checkpoint cannot consume a runner indefinitely.
    timeout-minutes: 15
    # Expose these values to dependent jobs so aggregation can verify completeness against what prepare actually resolved.
    outputs:
      # Set `image_count` from GitHub context/expression `${{ steps.manifest.outputs.image_count }}`, passing an earlier input/output into this stage without recomputing it.
      image_count: ${{ steps.manifest.outputs.image_count }}
      # Set `task_count` from GitHub context/expression `${{ steps.manifest.outputs.task_count }}`, passing an earlier input/output into this stage without recomputing it.
      task_count: ${{ steps.manifest.outputs.task_count }}
      # Set `exploitgym_sha` from GitHub context/expression `${{ steps.manifest.outputs.exploitgym_sha }}`, passing an earlier input/output into this stage without recomputing it.
      exploitgym_sha: ${{ steps.manifest.outputs.exploitgym_sha }}
    # List this job’s operations in execution order; later steps consume files and outputs produced by earlier ones.
    steps:
      # Start a visible Actions step named 'Resolve pinned ExploitGym commit and fetch only required metadata'; this label is what a reviewer sees in the run log.
      - name: Resolve pinned ExploitGym commit and fetch only required metadata
        # Set `id` to `upstream` for this workflow component; this value is later consumed by the experiment or its reporting logic.
        id: upstream
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
        env:
          # Set `EXPLOITGYM_REF` from GitHub context/expression `${{ inputs.exploitgym_ref || 'main' }}`, passing an earlier input/output into this stage without recomputing it.
          EXPLOITGYM_REF: ${{ inputs.exploitgym_ref || 'main' }}
          # Set `GH_TOKEN` from GitHub context/expression `${{ github.token }}`, passing an earlier input/output into this stage without recomputing it.
          GH_TOKEN: ${{ github.token }}
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Create the working directories `stage1-upstream/data/task_ids stage1-upstream/src/cybergym/task` idempotently before writing manifests/results into them.
          mkdir -p stage1-upstream/data/task_ids stage1-upstream/src/cybergym/task
          # Run the embedded Python block below for structured parsing/validation/report generation that would be brittle in shell alone.
          python3 - <<'PYUPSTREAM'
          # Import the modules needed here: `import json, os, pathlib, urllib.parse, urllib.request`; these provide parsing, hashing, subprocess, timing, or filesystem primitives without external Python packages.
          import json, os, pathlib, urllib.parse, urllib.request

          # Compute `owner_repo` from `'sunblaze-ucb/exploitgym'`; this value becomes an input to the next validation/reporting step.
          owner_repo = 'sunblaze-ucb/exploitgym'
          # Compute `ref` from `os.environ['EXPLOITGYM_REF']`; this value becomes an input to the next validation/reporting step.
          ref = os.environ['EXPLOITGYM_REF']
          # Compute `token` from `os.environ.get('GH_TOKEN','')`; this value becomes an input to the next validation/reporting step.
          token = os.environ.get('GH_TOKEN','')

          # Define `request()` so this operation is implemented once and reused consistently across every image/result.
          def request(url, accept=None):
              # Compute `headers` from `{'User-Agent':'exploitgym-criu-stage1'}`; this value becomes an input to the next validation/reporting step.
              headers = {'User-Agent':'exploitgym-criu-stage1'}
              # Test `accept` before accepting this state; the nested block handles the exceptional or qualifying case.
              if accept:
                  # Compute `headers['Accept']` from `accept`; this value becomes an input to the next validation/reporting step.
                  headers['Accept'] = accept
              # Test `token` before accepting this state; the nested block handles the exceptional or qualifying case.
              if token:
                  # Compute `headers['Authorization']` from `'Bearer ' + token`; this value becomes an input to the next validation/reporting step.
                  headers['Authorization'] = 'Bearer ' + token
              # Compute `req` from `urllib.request.Request(url, headers=headers)`; this value becomes an input to the next validation/reporting step.
              req = urllib.request.Request(url, headers=headers)
              # Use the context manager `urllib.request.urlopen(req, timeout=60) as r` so the file/network resource is closed even if parsing fails.
              with urllib.request.urlopen(req, timeout=60) as r:
                  # Return `r.read()` to the caller; downstream validation uses this normalized value rather than reparsing raw command output.
                  return r.read()

          # Resolve a branch/tag/SHA once, then fetch every metadata file by immutable SHA.
          # Compute `api` from `'https://api.github.com/repos/' + owner_repo + '/commits/' + urllib.parse.quote(ref, safe='')`; this value becomes an input to the next validation/reporting step.
          api = 'https://api.github.com/repos/' + owner_repo + '/commits/' + urllib.parse.quote(ref, safe='')
          # Compute `commit` from `json.loads(request(api, 'application/vnd.github+json'))`; this value becomes an input to the next validation/reporting step.
          commit = json.loads(request(api, 'application/vnd.github+json'))
          # Compute `sha` from `commit.get('sha','')`; this value becomes an input to the next validation/reporting step.
          sha = commit.get('sha','')
          # Test `len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha.lower())` before accepting this state; the nested block handles the exceptional or qualifying case.
          if len(sha) != 40 or any(c not in '0123456789abcdef' for c in sha.lower()):
              # Fail immediately with `raise SystemExit('Could not resolve ExploitGym ref to a full commit SHA: ' + repr(sha))` because continuing would produce evidence that violates an experiment invariant.
              raise SystemExit('Could not resolve ExploitGym ref to a full commit SHA: ' + repr(sha))

          # Compute `files` from `[`; this value becomes an input to the next validation/reporting step.
          files = [
              # Execute `'data/task_ids/v1.txt',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'data/task_ids/v1.txt',
              # Execute `'src/cybergym/task/metadata.json',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'src/cybergym/task/metadata.json',
              # Execute `'src/cybergym/task/v8_metadata.json',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'src/cybergym/task/v8_metadata.json',
              # Execute `'src/cybergym/task/kernel_metadata.json',` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'src/cybergym/task/kernel_metadata.json',
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          ]
          # Compute `base` from `'https://raw.githubusercontent.com/' + owner_repo + '/' + sha + '/'`; this value becomes an input to the next validation/reporting step.
          base = 'https://raw.githubusercontent.com/' + owner_repo + '/' + sha + '/'
          # Compute `root` from `pathlib.Path('stage1-upstream')`; this value becomes an input to the next validation/reporting step.
          root = pathlib.Path('stage1-upstream')
          # Compute `inventory` from `[]`; this value becomes an input to the next validation/reporting step.
          inventory=[]
          # Import the modules needed here: `import hashlib`; these provide parsing, hashing, subprocess, timing, or filesystem primitives without external Python packages.
          import hashlib
          # Iterate through `rel in files` so each task/image/file contributes deterministically to the manifest or report.
          for rel in files:
              # Compute `data` from `request(base + rel)`; this value becomes an input to the next validation/reporting step.
              data = request(base + rel)
              # Compute `path` from `root / rel`; this value becomes an input to the next validation/reporting step.
              path = root / rel
              # Execute `path.parent.mkdir(parents=True, exist_ok=True)` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              path.parent.mkdir(parents=True, exist_ok=True)
              # Write the exact fetched/generated bytes with `path.write_bytes(data)`, preserving upstream content without text normalization.
              path.write_bytes(data)
              # Execute `inventory.append({'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              inventory.append({'path':rel,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})

          # Persist structured evidence with `(root/'upstream.json').write_text(json.dumps({` so the aggregate job can reproduce the conclusion without scraping console logs.
          (root/'upstream.json').write_text(json.dumps({
              # Execute `'repository': owner_repo,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'repository': owner_repo,
              # Execute `'requested_ref': ref,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'requested_ref': ref,
              # Execute `'resolved_sha': sha,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'resolved_sha': sha,
              # Execute `'files': inventory,` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              'files': inventory,
          # Continue/close the multi-line Python expression started above; keeping the structure explicit makes the evidence schema reviewable.
          }, indent=2) + '\n')
          # Use the context manager `open(os.environ['GITHUB_OUTPUT'],'a') as f` so the file/network resource is closed even if parsing fails.
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              # Execute `f.write('exploitgym_sha=' + sha + '\n')` as part of the structured experiment logic; its result feeds the surrounding manifest, fidelity check, or aggregate report.
              f.write('exploitgym_sha=' + sha + '\n')
          # Emit `print('Pinned ExploitGym', ref, '->', sha)` into the Actions log; these lines are intentionally human-auditable checkpoints alongside JSON evidence.
          print('Pinned ExploitGym', ref, '->', sha)
          # Iterate through `row in inventory` so each task/image/file contributes deterministically to the manifest or report.
          for row in inventory:
              # Emit `print('FETCHED', row['path'], row['bytes'], row['sha256'])` into the Actions log; these lines are intentionally human-auditable checkpoints alongside JSON evidence.
              print('FETCHED', row['path'], row['bytes'], row['sha256'])
          # End the embedded Python helper; Bash resumes with the structured output/files it produced.
          PYUPSTREAM

      # Start a visible Actions step named 'Build unique-image manifest and 20 shards'; this label is what a reviewer sees in the run log.
      - name: Build unique-image manifest and 20 shards
        # Set `id` to `manifest` for this workflow component; this value is later consumed by the experiment or its reporting logic.
        id: manifest
        # Execute the following run block with bash, so strict-shell behavior is predictable.
        shell: bash
        # Pin experiment-wide versions and retry policy in one place so every shard uses the same runtime.
        env:
          # Set `EXPECTED_TASK_COUNT` from GitHub context/expression `${{ inputs.expected_task_count || '869' }}`, passing an earlier input/output into this stage without recomputing it.
          EXPECTED_TASK_COUNT: ${{ inputs.expected_task_count || '869' }}
          # Set `USER_MODE` from GitHub context/expression `${{ inputs.user_mode || 'exp.none' }}`, passing an earlier input/output into this stage without recomputing it.
          USER_MODE: ${{ inputs.user_mode || 'exp.none' }}
          # Set `V8_VARIANT` from GitHub context/expression `${{ inputs.v8_variant || 'main' }}`, passing an earlier input/output into this stage without recomputing it.
          V8_VARIANT: ${{ inputs.v8_variant || 'main' }}
        # Begin the multi-line program for this step; everything indented below is executed verbatim by the selected shell.
        run: |
          # Fail on command errors, unset variables, and pipeline failures; silent partial evidence would make the sweep scientifically misleading.
          set -Eeuo pipefail
          # Create the working directories `stage1-manifest/shards` idempotently before writing manifests/results into them.
          mkdir -p stage1-manifest/shards
          # Run the embedded Python block below for structured parsing/validation/report generation that would be brittle in shell alone.
          python3 - <<'PY'
          # Import the modules needed here: `import json, os, pathlib`; these provide parsing, hashing, subprocess, timing, or filesystem primitives without external Python packages.
          import json, os, pathlib

          # Compute `root` from `pathlib.Path('stage1-upstream')`; this value becomes an input to the next validation/reporting step.
          root = pathlib.Path('stage1-upstream')
          # Compute `tasks_path` from `root / 'data/task_ids/v1.txt'`; this value becomes an input to the next validation/reporting step.
          tasks_path = root / 'data/task_ids/v1.txt'
          # Compute `task_ids` from `[x.strip() for x in tasks_path.read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]`; this value becomes an input to the next validation/reporting step.
          task_ids = [x.strip() for x in tasks_path.read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          # Compute `expected` from `int(os.environ['EXPECTED_TASK_COUNT'])`; this value becomes an input to the next validation/reporting step.
          expected = int(os.environ['EXPECTED_TASK_COUNT'])
          # Test `len(task_ids) != expected` before accepting this state; the nested block handles the exceptional or qualifying case.
          if len(task_ids) != expected:
              # Fail immediately with `raise SystemExit(f'ExploitGym corpus drift: expected {expected} tasks, found {len(task_ids)}')` because continuing would produce evidence that violates an experiment invariant.
              raise SystemExit(f'ExploitGym corpus drift: expected {expected} tasks, found {len(task_ids)}')

          # Define `load()` so this operation is implemented once and reused consistently across every image/result.
          def load(name):
              # Return `json.loads((root / 'src/cybergym/task' / name).read_text())` to the caller; downstream validation uses this normalized value rather than reparsing raw command output.
              return json.loads((root / 'src/cybergym/task' / name).read_text())

          # Define `build_index()` so this operation is implemented once and reused consistently across every image/result.
          def build_index(rows, family):
              # ExploitGym's v1.txt intentionally uses human-readable aliases such as
              # user:cybergym/arvo_1461 and kernel:kernelctf/CVE-2023-3776_lts,
              # while metadata.json also carries an opaque hashed task_id. Upstream's
              # metadata.py indexes BOTH forms; mirror that behavior exactly here.
              # Compute `index` from `{}`; this value becomes an input to the next validation/reporting step.
              index = {}
              # Iterate through `row in rows` so each task/image/file contributes deterministically to the manifest or report.
              for row in rows:
                  # Compute `hashed` from `row.get('task_id')`; this value becomes an input to the next validation/reporting step.
                  hashed = row.get('task_id')
                  # Compute `entry` from `row.get('entry_name')`; this value becomes an input to the next validation/reporting step.
                  entry = row.get('entry_name')
                  # Test `not isinstance(hashed, str) or not hashed.startswith(family + ':')` before accepting this state; the nested block handles the exceptional or qualifying case.
                  if not isinstance(hashed, str) or not hashed.startswith(family + ':'):
                      # Fail immediately with `raise ValueError(f'{family} metadata row has invalid task_id: {hashed!r}')` because continuing would produce evidence that violates an experiment invariant.
                      raise ValueError(f'{family} metadata row has invalid task_id: {hashed!r}')
                  # Test `not isinstance(entry, str) or not entry` before accepting this state; the nested block handles the exceptional or qualifying case.
                  if not isinstance(entry, str) or not entry:
                      # Fail immediately with `raise ValueError(f'{family} metadata row has invalid entry_name: {entry!r}')` because continuing would produce evidence that violates an experiment invariant.
                      raise ValueError(f'{family} metadata row has invalid entry_name: {entry!r}')
                  # Compute `alias` from `f'{family}:{entry}'`; this value becomes an input to the next validation/reporting step.
                  alias = f'{family}:{entry}'
                  # Iterate through `key in (hashed, alias)` so each task/image/file contributes deterministically to the manifest or report.
                  for key in (hashed, alias):
                      # Compute `old` from `index.get(key)`; this value becomes an input to the next validation/reporting step.
                      old = index.get(key)
                      # Test `old is not None and old is not row` before accepting this state; the nested block handles the exceptional or qualifying case.
                      if old is not None and old is not row:
                          # Fail immediately with `raise ValueError(f'duplicate metadata key {key!r}')` because continuing would produce evidence that violates an experiment invariant.
                          raise ValueError(f'duplicate metadata key {key!r}')
                      # Compute `index[key]` from `row`; this value becomes an input to the next validation/reporting step.
                      index[key] = row
              # Return `index` to the caller; downstream validation uses this normalized value rather than reparsing raw command output.
              return index

          # Compute `user_rows` from `load('metadata.json')`; this value becomes an input to the next validation/reporting step.
          user_rows = load('metadata.json')
          # Compute `v8_rows` from `load('v8_metadata.json')`; this value becomes an input to the next validation/reporting step.
          v8_rows = load('v8_metadata.json')
          # Compute `kernel_rows` from `load('kernel_metadata.json')`; this value becomes an input to the next validation/reporting step.
          kernel_rows = load('kernel_metadata.json')
          # Test `not all(isinstance(x, list) for x in (user_rows, v8_rows, kernel_rows))` before accepting this state; the nested block handles the exceptional or qualifying case.
          if not all(isinstance(x, list) for x in (user_rows, v8_rows, kernel_rows)):
              # Fail immediately with `raise SystemExit('One or more ExploitGym metadata files are not JSON arrays')` because continuing would produce evidence that violates an experiment invariant.
              raise SystemExit('One or more ExploitGym metadata files are not JSON arrays')
          # Compute `users` from `build_index(user_rows, 'user')`; this value becomes an input to the next validation/reporting step.
          users = build_index(user_rows, 'user')
          # Compute `v8s` from `build_index(v8_rows, 'v8')`; this value becomes an input to the next validation/reporting step.
